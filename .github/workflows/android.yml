name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Update API KEY from Secrets
      env: 
        MAPS_KEY: ${{ secrets.CI_DUMMY_MAPS_API_KEY }}
      run: printf 'MAPS_API_KEY=%s\n' "${MAPS_KEY:-unused-foss-build-key}" > ./local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew testDebugUnitTest assembleDebug -PwigleFossMain=true
    - name: Upload installable debug APK
      uses: actions/upload-artifact@v4
      with:
        name: wigle-wifi-custom-debug-apk
        path: wiglewifiwardriving/build/outputs/apk/debug/*.apk
        if-no-files-found: error
