name: Android CI

on:
  push:
    branches: [ "foss-custom" ]
  pull_request:
    branches: [ "foss-custom" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew testDebugUnitTest assembleDebug -PwigleFossMain=true
    - name: Upload installable debug APK
      uses: actions/upload-artifact@v4
      with:
        name: wigle-wifi-foss-custom-debug-apk
        path: wiglewifiwardriving/build/outputs/apk/debug/*.apk
        if-no-files-found: error
