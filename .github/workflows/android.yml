name: Android CI

on:
  push:
    branches: [ "foss-custom" ]
  pull_request:
    branches: [ "foss-custom" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Verify network row layouts across Android API variants
      run: python3 scripts/check_network_row_layouts.py
    - name: Configure persistent APK signing key
      env:
        SIGNING_KEYSTORE_B64: ${{ secrets.WIGLE_SIGNING_KEYSTORE_BASE64 }}
        WIGLE_SIGNING_PASSWORD: ${{ secrets.WIGLE_SIGNING_PASSWORD }}
      run: |
        if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$WIGLE_SIGNING_PASSWORD" ]; then
          echo "Missing WiGLE APK signing secret(s)" >&2
          exit 1
        fi
        printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wigle-foss-custom.p12"
        echo "WIGLE_SIGNING_KEYSTORE=$RUNNER_TEMP/wigle-foss-custom.p12" >> "$GITHUB_ENV"
        echo "WIGLE_SIGNING_PASSWORD=$WIGLE_SIGNING_PASSWORD" >> "$GITHUB_ENV"
    - name: Build with Gradle
      run: ./gradlew testDebugUnitTest assembleDebug -PwigleFossMain=true
    - name: Upload installable debug APK
      uses: actions/upload-artifact@v4
      with:
        name: wigle-wifi-foss-replacement-apk
        path: wiglewifiwardriving/build/outputs/apk/debug/*.apk
        if-no-files-found: error
